packages:
  - '.'
  - '../security'

blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # Emergency patched releases for the 2026-08-09 request-DoS advisories.
  - '@sveltejs/kit@2.70.2'
  - 'nanoid@3.3.17'
  - 'postcss@8.5.26'

allowBuilds:
  esbuild: true

overrides:
  '@sveltejs/kit': 2.70.2
  cookie: 0.7.2
  esbuild: 0.28.1
  immutable: ^4.3.9
  postcss: 8.5.26
  vite: 8.1.5
